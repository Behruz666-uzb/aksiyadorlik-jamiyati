<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<title>Aksiyadorlik jamiyati darsi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a stock-exchange trading board — fixed top bar + live ticker, one full-screen "view" at a time, everything sized for touch on an interactive board */
:root{
  --bg:#0c1424; --surface:#141f37; --surface-2:#1c2a49; --line:#2b3c63;
  --fg:#eef2ff; --muted:#98a5c6;
  --gold:#f4b73f; --gold-ink:#1d1405; --gold-soft:rgba(244,183,63,.14);
  --up:#2bd47f; --down:#ff5d70; --sky:#5ec9ff; --violet:#a98bff;
  --up-soft:rgba(43,212,127,.16); --down-soft:rgba(255,93,112,.16);
  --shadow:0 .6rem 2rem rgba(0,0,0,.35);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#edf1f9; --surface:#ffffff; --surface-2:#e2e8f5; --line:#c6d0e6;
  --fg:#111a32; --muted:#55617f;
  --gold:#e7a21a; --gold-ink:#1d1405; --gold-soft:rgba(231,162,26,.16);
  --up:#10a45b; --down:#e0364c; --sky:#1689d3; --violet:#7656d8;
  --up-soft:rgba(16,164,91,.13); --down-soft:rgba(224,54,76,.12);
  --shadow:0 .5rem 1.6rem rgba(30,45,90,.14);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#edf1f9; --surface:#ffffff; --surface-2:#e2e8f5; --line:#c6d0e6;
  --fg:#111a32; --muted:#55617f;
  --gold:#e7a21a; --gold-ink:#1d1405; --gold-soft:rgba(231,162,26,.16);
  --up:#10a45b; --down:#e0364c; --sky:#1689d3; --violet:#7656d8;
  --up-soft:rgba(16,164,91,.13); --down-soft:rgba(224,54,76,.12);
  --shadow:0 .5rem 1.6rem rgba(30,45,90,.14);
  color-scheme:light;
}
html{font-size:clamp(15px, .85vw + 4px, 24px);height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1rem;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.12}
.app{height:100%;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:.8rem;padding-block:.55rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:.6rem;flex-shrink:0;padding:.2rem .4rem;border-radius:.7rem}
.brand-mark{width:2.3rem;height:2.3rem;border-radius:.6rem;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:.8rem}
.brand-txt{display:flex;flex-direction:column;line-height:1.1;text-align:left}
.brand-txt small{color:var(--muted);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase}
.brand-txt b{font-family:var(--display);font-size:.85rem;font-weight:700}
.nav{display:flex;gap:.35rem;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:.1rem}
.nav::-webkit-scrollbar{display:none}
.nav button{display:flex;align-items:center;gap:.45rem;padding:.55rem .85rem;border-radius:.75rem;white-space:nowrap;font-weight:600;font-size:.86rem;color:var(--muted);min-height:2.6rem}
.nav button svg{width:1.15rem;height:1.15rem;flex-shrink:0}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button.on{background:var(--gold);color:var(--gold-ink)}
.tools{display:flex;gap:.3rem;flex-shrink:0}
.tbtn{width:2.7rem;height:2.7rem;border-radius:.75rem;display:grid;place-items:center;background:var(--surface-2);color:var(--fg);position:relative}
.tbtn svg{width:1.25rem;height:1.25rem}
.tbtn:hover{background:var(--line)}
.tbtn.on{background:var(--gold);color:var(--gold-ink)}
.tbtn .mini{position:absolute;bottom:-.35rem;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:.6rem;background:var(--down);color:#fff;padding:0 .3rem;border-radius:.4rem;white-space:nowrap}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- ticker ---------- */
.ticker{overflow:hidden;background:var(--bg);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.78rem;white-space:nowrap;position:relative}
.ticker-track{display:inline-flex;gap:2.4rem;padding:.35rem 0;animation:tick 60s linear infinite;will-change:transform}
.tk b{color:var(--fg);margin-right:.5rem}
.tk span{color:var(--muted);margin-right:.4rem}
.tk .u{color:var(--up)} .tk .d{color:var(--down)}
.ticker-tag{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;padding:0 .8rem 0 2.5rem;background:linear-gradient(90deg,transparent,var(--bg) 2rem);color:var(--muted);font-size:.66rem;font-family:var(--body)}
@keyframes tick{to{transform:translateX(-50%)}}

/* ---------- views ---------- */
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding-block:1.2rem 2rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view.fit{overflow:hidden;display:flex;flex-direction:column;padding-bottom:1rem}
.wrap{max-width:80rem;margin:0 auto}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.vh h2{font-size:1.7rem;margin-top:.2rem}
.vh p{margin:.3rem 0 0;color:var(--muted);max-width:42rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.3rem;border-radius:.9rem;font-weight:700;background:var(--surface-2);min-height:3rem;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn svg{width:1.2rem;height:1.2rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .8rem;border-radius:2rem;background:var(--surface-2);font-weight:600;font-size:.82rem}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:2rem;align-items:center;margin-bottom:1.6rem}
.hero h1{font-size:clamp(2.2rem,5vw,4.6rem);font-weight:900;letter-spacing:-.02em;margin:.4rem 0 .8rem}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:34rem;margin:0 0 1.2rem}
.hero-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.cert{position:relative;aspect-ratio:1.55/1;max-width:100%;border-radius:1.2rem;padding:1.3rem 1.5rem;color:var(--gold-ink);background:
  repeating-radial-gradient(circle at 20% 120%, rgba(0,0,0,.0) 0 7px, rgba(0,0,0,.06) 7px 8px),
  repeating-radial-gradient(circle at 90% -20%, rgba(255,255,255,.0) 0 9px, rgba(255,255,255,.18) 9px 10px),
  linear-gradient(135deg,#f9d27a,#f0ad2c 55%,#e39a1c);box-shadow:var(--shadow);overflow:hidden;transform:rotate(-2.5deg);animation:float 6s ease-in-out infinite}
.cert:before{content:"";position:absolute;inset:.6rem;border:2px dashed rgba(29,20,5,.35);border-radius:.8rem;pointer-events:none}
.cert .c-top{display:flex;justify-content:space-between;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.cert .c-title{font-family:var(--display);font-weight:900;font-size:clamp(1.6rem,3.2vw,2.8rem);margin:.6rem 0 .2rem;letter-spacing:.04em}
.cert .c-sub{font-weight:600;font-size:.85rem;opacity:.85}
.cert .c-val{position:absolute;left:1.5rem;bottom:1.2rem;font-family:var(--mono);font-weight:700;font-size:1.25rem}
.cert .c-val small{display:block;font-family:var(--body);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.cert .seal{position:absolute;right:1.4rem;bottom:1rem;width:5.2rem;height:5.2rem;border-radius:50%;background:var(--gold-ink);color:#f4b73f;display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:.55rem;font-weight:700;line-height:1.2;box-shadow:0 0 0 4px rgba(29,20,5,.25)}
@keyframes float{50%{transform:rotate(-1deg) translateY(-.4rem)}}
.ask{background:var(--surface);border:2px solid var(--line);border-radius:1.2rem;padding:1.1rem 1.3rem;display:flex;gap:1rem;align-items:center;margin-bottom:1.6rem;flex-wrap:wrap}
.ask .q{flex:1;min-width:14rem;font-size:1.1rem;font-weight:600}
.ask .q small{display:block;color:var(--gold);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.2rem}
.ask .ans{flex-basis:100%;padding:.8rem 1rem;background:var(--gold-soft);border-radius:.8rem}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem}
.tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:1.1rem;padding:1.1rem;min-height:9rem;display:flex;flex-direction:column;gap:.5rem;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-3px);border-color:var(--gold)}
.tile .n{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.tile .ic{width:2.8rem;height:2.8rem;border-radius:.8rem;display:grid;place-items:center;color:var(--bg)}
.tile .ic svg{width:1.5rem;height:1.5rem}
.tile b{font-family:var(--display);font-size:1rem;font-weight:700}
.tile span.d{color:var(--muted);font-size:.85rem}
.tile .min{position:absolute;top:1rem;right:1rem;font-family:var(--mono);font-size:.7rem;color:var(--muted)}

/* ---------- slides ---------- */
.deck{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;gap:.7rem}
.slide-area{flex:1;min-height:0;position:relative;border-radius:1.4rem;background:var(--surface);border:1px solid var(--line);overflow:hidden;touch-action:pan-y}
.slide{position:absolute;inset:0;padding:2rem 2.6rem;display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateX(4%);transition:opacity .45s,transform .45s;pointer-events:none}
.slide.on{opacity:1;transform:none;pointer-events:auto}
.slide.prev{transform:translateX(-4%)}
.slide h3{font-size:clamp(1.5rem,2.6vw,2.4rem);margin-bottom:1.1rem}
.slide .tag{font-family:var(--mono);font-size:.75rem;color:var(--gold);margin-bottom:.5rem}
.slide p{font-size:1.15rem;margin:.3rem 0;max-width:60rem}
.def{border-left:.4rem solid var(--gold);background:var(--gold-soft);border-radius:.4rem 1rem 1rem .4rem;padding:1rem 1.3rem;font-size:1.25rem;margin:.6rem 0}
.def b{color:var(--gold)}
.law{font-size:.9rem;color:var(--muted);font-style:italic;margin-top:.6rem}
.deck-bar{display:flex;align-items:center;gap:.7rem}
.dots{flex:1;display:flex;gap:.3rem;min-width:0}
.dots button{flex:1;height:.55rem;border-radius:1rem;background:var(--surface-2);min-width:.5rem}
.dots button.on{background:var(--gold)}
.dots button.seen{background:var(--line)}
.count{font-family:var(--mono);font-size:.9rem;color:var(--muted);min-width:4rem;text-align:center}
.arrow{width:3.4rem;height:3.4rem;border-radius:1rem;background:var(--surface-2);display:grid;place-items:center}
.arrow svg{width:1.6rem;height:1.6rem}
.arrow.gold{background:var(--gold);color:var(--gold-ink)}
.cols5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.8rem}
.ic-card{background:var(--surface-2);border-radius:1rem;padding:1rem;display:flex;flex-direction:column;gap:.5rem;animation:rise .5s both}
.ic-card .ic{width:3rem;height:3rem;border-radius:.9rem;display:grid;place-items:center;color:var(--bg)}
.ic-card .ic svg{width:1.6rem;height:1.6rem}
.ic-card b{font-size:1rem}
.ic-card span{font-size:.92rem;color:var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(1rem)}}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.vs-col{border-radius:1.1rem;padding:1.2rem;background:var(--surface-2)}
.vs-col h4{font-family:var(--display);font-size:1.25rem;margin:0 0 .7rem;display:flex;align-items:center;gap:.6rem}
.vs-col h4 svg{width:1.3em;height:1.3em;flex-shrink:0}
.sin{display:flex;flex-direction:column;flex:1;min-height:0;transform-origin:0 0}
.vs-col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.55rem}
.vs-col li{display:flex;gap:.6rem;font-size:1.05rem}
.vs-col li:before{content:"";flex:0 0 .55rem;height:.55rem;border-radius:50%;margin-top:.5rem;background:currentColor;opacity:.6}
.vs-col.up{box-shadow:inset 0 .35rem 0 var(--up)} .vs-col.up h4{color:var(--up)}
.vs-col.down{box-shadow:inset 0 .35rem 0 var(--down)} .vs-col.down h4{color:var(--down)}
.vs-col.sky{box-shadow:inset 0 .35rem 0 var(--sky)} .vs-col.sky h4{color:var(--sky)}
.vs-col.gold{box-shadow:inset 0 .35rem 0 var(--gold)} .vs-col.gold h4{color:var(--gold)}
.rows{display:flex;flex-direction:column;gap:.5rem}
.cmp{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:.5rem;align-items:stretch}
.cmp div{background:var(--surface-2);padding:.75rem 1rem;border-radius:.8rem;font-size:1.02rem}
.cmp .h{background:transparent;font-family:var(--display);font-size:1rem;padding-block:.2rem}
.cmp .k{color:var(--muted);font-weight:600}
.big-num{font-family:var(--display);font-weight:900;font-size:clamp(2.4rem,5vw,4.4rem);color:var(--gold);line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
.chips .chip{font-size:1rem;padding:.55rem 1rem}
.reveal-q{display:flex;flex-direction:column;gap:.5rem}
.rq{text-align:left;background:var(--surface-2);border-radius:.9rem;padding:.8rem 1rem;font-size:1.05rem;font-weight:600;display:block;width:100%}
.rq .a{display:block;font-weight:500;color:var(--up);margin-top:.4rem;font-size:.98rem}
.rq .hint{float:right;font-size:.75rem;color:var(--muted);font-weight:500}
.formula{font-family:var(--mono);font-size:1.2rem;background:var(--surface-2);padding:1rem 1.2rem;border-radius:1rem;display:inline-block}
.formula .u{color:var(--up)} .formula .d{color:var(--down)}
.mini-cert{width:min(26rem,100%);aspect-ratio:1.6/1;transform:rotate(-2deg);animation:none}

/* ---------- video ---------- */
.player{width:100%;max-width:min(100%, calc((100vh - 16rem) * 16 / 9));margin:0 auto;display:flex;flex-direction:column;gap:.7rem}
.player .seg-tabs{justify-content:center}
.film{display:flex;flex-direction:column;gap:.6rem}
.stage{position:relative;aspect-ratio:16/9;width:100%;border-radius:1.2rem;overflow:hidden;background:#0d1530;box-shadow:var(--shadow)}
.scn-layer{position:absolute;inset:0}
.scn{position:absolute;inset:0}
.scn svg{width:100%;height:100%;display:block;transform-origin:50% 60%;animation:kb 10s linear both}
.scn.enter{animation:scnIn .7s ease both}
.scn.leave{animation:scnOut .6s ease both}
.stage.paused .scn,.stage.paused .scn *{animation-play-state:paused!important}
.scn .ft{font-family:var(--display);font-weight:900}
.scn .fb{font-family:var(--body);font-weight:700}
.scn .pop,.scn .popin,.scn .rise,.scn .stamp,.scn .growup,.scn .spin,.scn .flick,.scn .smoke,.scn .blink,.scn .tw,.scn .pulse,.scn .shrink,.scn .lid{transform-box:fill-box}
.scn .pop{transform-origin:center;animation:fpop .6s cubic-bezier(.2,1.5,.4,1) both}
.scn .popin{transform-origin:50% 100%;animation:fpop .6s cubic-bezier(.2,1.5,.4,1) both}
.scn .walkin{animation:walkin 2.2s cubic-bezier(.25,.8,.35,1) both}
.scn .bob{animation:bob 2.6s ease-in-out infinite}
.scn .blink{transform-origin:center;animation:blink2 4.2s infinite}
.scn .wave{transform-box:view-box;animation:wave .55s ease-in-out infinite alternate}
.scn .rise{animation:rise3 .7s cubic-bezier(.2,1.3,.4,1) both}
.scn .fadein{animation:fin .6s both}
.scn .fadeout{animation:fout .5s both}
.scn .stamp{transform-origin:center;animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
.scn .growup{transform-origin:50% 100%;animation:growup .8s cubic-bezier(.2,1.4,.4,1) both}
.scn .spin{transform-origin:center;animation:spin 40s linear infinite}
.scn .flick{transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate}
.scn .smoke{transform-origin:center;animation:smoke 3.2s ease-out infinite}
.scn .drift{animation:drift 30s ease-in-out infinite alternate}
.scn .fall{animation:fallc .9s cubic-bezier(.45,0,.9,.7) both}
.scn .draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 3s ease-out forwards}
.scn .tw{transform-origin:center;animation:tw 1.6s ease-in-out infinite}
.scn .float{animation:float2 2.4s ease-in-out infinite}
.scn .pulse{transform-origin:center;animation:pulse 1.4s ease-in-out infinite}
.scn .shrink{transform-origin:center;animation:shrink .7s ease-in both}
.scn .lid{transform-origin:0% 100%;animation:lid .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.045)}}
@keyframes scnIn{from{opacity:0;transform:scale(1.03)}}
@keyframes scnOut{to{opacity:0}}
@keyframes fpop{from{opacity:0;transform:scale(.2)}}
@keyframes walkin{from{transform:translateX(var(--dx))}}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes blink2{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wave{from{transform:rotate(-150deg)}to{transform:rotate(-112deg)}}
@keyframes rise3{from{opacity:0;transform:translateY(40px)}}
@keyframes fin{from{opacity:0}}
@keyframes fout{to{opacity:0}}
@keyframes stamp{from{opacity:0;transform:scale(2.6)}}
@keyframes growup{from{transform:scaleY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flick{to{transform:scale(1.12,1.35);opacity:.85}}
@keyframes smoke{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:.7}100%{opacity:0;transform:translateY(-170px) scale(2)}}
@keyframes drift{to{transform:translateX(160px)}}
@keyframes fallc{from{opacity:0;transform:translate(var(--fx),var(--fy))}25%{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes tw{50%{opacity:.3;transform:scale(.6)}}
@keyframes float2{50%{transform:translateY(-14px)}}
@keyframes pulse{50%{transform:scale(1.12);opacity:.75}}
@keyframes shrink{to{opacity:0;transform:scale(.3)}}
@keyframes lid{to{transform:rotate(-35deg)}}
.chap{position:absolute;top:3.5%;left:2.5%;background:rgba(12,16,32,.62);color:#fff;font-weight:700;font-size:.62em;padding:.35em .9em;border-radius:2em;letter-spacing:.02em}
.subs{position:absolute;left:50%;bottom:4.5%;transform:translateX(-50%);width:max-content;max-width:90%;background:rgba(12,16,32,.8);color:#fff;padding:.45em 1em;border-radius:.6em;font-weight:600;font-size:1em;line-height:1.3;text-align:center}
.subs.in{animation:subIn .45s both}
@keyframes subIn{from{opacity:0;transform:translate(-50%,30%)}}
.big-play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5em;background:rgba(10,14,30,.55);color:#fff;z-index:5;font-size:1em}
.big-play .bp-ic{width:3.6em;height:3.6em;border-radius:50%;background:#f4b73f;color:#1d1405;display:grid;place-items:center;box-shadow:0 0 0 .5em rgba(244,183,63,.3);animation:pulseB 1.6s ease-in-out infinite}
.big-play .bp-ic svg{width:1.6em;height:1.6em;margin-left:.15em}
.big-play b{font-family:var(--display);font-size:1.3em;margin-top:.4em}
.big-play small{font-size:.65em;opacity:.85}
@keyframes pulseB{50%{box-shadow:0 0 0 1em rgba(244,183,63,.12)}}
.pbar{display:flex;gap:.3rem;align-items:center}
.pbar .seg{height:.55rem;border-radius:1rem;background:var(--surface-2);overflow:hidden;cursor:pointer;min-width:.4rem}
.pbar .seg i{display:block;height:100%;width:0;background:var(--gold)}
.ctrls{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.ctrls .sp{flex:1}
.vtime{font-family:var(--mono);color:var(--muted);font-size:.9rem}
.yt-frame{position:relative;aspect-ratio:16/9;width:100%;border-radius:1.2rem;overflow:hidden;background:#000;box-shadow:var(--shadow)}
.yt-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;aspect-ratio:16/9;width:100%;border-radius:1.2rem;background:radial-gradient(circle at 50% 40%,var(--surface-2),var(--surface));border:2px solid var(--line);color:var(--fg);text-decoration:none;text-align:center;padding:1rem;transition:border-color .2s}

.yt-play svg{width:2.6rem;height:2.6rem}
.yt-card b{font-family:var(--display);font-size:1.6rem}
.yt-card span{color:var(--muted)}
.yt-note{color:var(--muted);text-align:center;margin:.2rem 0 0}
.yt-note a{color:var(--sky);font-weight:700}

/* ---------- flip cards ---------- */
.fgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.9rem}
.flip{perspective:1200px;min-height:12rem;text-align:left}
.flip .inner{position:relative;width:100%;height:100%;min-height:12rem;transition:transform .6s cubic-bezier(.3,1.2,.4,1);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.1rem;padding:1rem;display:flex;flex-direction:column}
.flip .f{background:var(--surface);border:2px solid var(--line);justify-content:space-between}
.flip .f b{font-family:var(--display);font-size:1.1rem;line-height:1.2}
.flip .f small{color:var(--muted);font-size:.75rem}
.flip .f .n{font-family:var(--mono);font-size:.8rem;color:var(--gold)}
.flip .b{background:var(--gold);color:var(--gold-ink);transform:rotateY(180deg);font-size:.95rem;font-weight:600;overflow:auto}
.flip .b b{font-family:var(--display);font-size:.78rem;margin-bottom:.4rem;letter-spacing:.04em;text-transform:uppercase}

/* ---------- sorting game ---------- */
.seg-tabs{display:flex;gap:.4rem;flex-wrap:wrap}
.seg-tabs button{padding:.6rem 1rem;border-radius:.8rem;background:var(--surface-2);font-weight:700;font-size:.9rem;min-height:2.8rem}
.seg-tabs button.on{background:var(--fg);color:var(--bg)}
.sorter{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:1rem;align-items:stretch;margin-top:1rem}
.bucket{border-radius:1.3rem;padding:1.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;font-family:var(--display);font-size:1.35rem;font-weight:700;min-height:16rem;border:3px solid currentColor;background:var(--surface);transition:transform .12s,background .2s;text-align:center}
.bucket:active{transform:scale(.96)}
.bucket svg{width:2.6rem;height:2.6rem}
.bucket.L{color:var(--sky)} .bucket.R{color:var(--violet)}
.bucket.flash-ok{background:var(--up-soft)} .bucket.flash-no{background:var(--down-soft)}
.bucket .cnt{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.sitem{background:var(--surface);border:2px solid var(--line);border-radius:1.3rem;padding:1.6rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:1rem;min-height:16rem;position:relative}
.sitem .txt{font-size:1.5rem;font-weight:700;line-height:1.3}
.sitem .prog{font-family:var(--mono);color:var(--muted);font-size:.85rem}
.sitem .fb{font-size:1rem;font-weight:600;min-height:1.5rem}
.sitem.ok{border-color:var(--up)} .sitem.no{border-color:var(--down);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-.6rem)}75%{transform:translateX(.6rem)}}
.sitem.in .txt{animation:pop .45s cubic-bezier(.2,1.5,.45,1) both}
.scorebar{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-top:1rem;justify-content:center}
.scorebar .chip{font-size:1rem;padding:.5rem 1rem}

/* ---------- quiz ---------- */
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center}
.team{border-radius:1.2rem;padding:.8rem 1.2rem;background:var(--surface);border:3px solid var(--line);display:flex;align-items:center;gap:.9rem;transition:border-color .2s,transform .2s}
.team.turn{border-color:var(--gold);transform:scale(1.02)}
.team .av{width:3.2rem;height:3.2rem;border-radius:1rem;display:grid;place-items:center;flex-shrink:0}
.team .av svg{width:2rem;height:2rem}
.team.bull .av{background:var(--up-soft);color:var(--up)}
.team.bear .av{background:var(--down-soft);color:var(--down)}
.team .nm{font-family:var(--display);font-weight:700;font-size:1.05rem;flex:1;min-width:0}
.team .nm small{display:block;font-family:var(--body);font-weight:600;font-size:.72rem;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;min-height:1em}
.team .pts{font-family:var(--mono);font-weight:700;font-size:2rem}
.team .ll{font-size:.75rem;padding:.35rem .6rem;border-radius:.6rem;background:var(--surface-2);font-weight:700}
.team .ll[disabled]{opacity:.35;text-decoration:line-through}
.vsmark{font-family:var(--display);font-weight:900;color:var(--muted)}
.qbox{margin-top:1rem;background:var(--surface);border:1px solid var(--line);border-radius:1.3rem;padding:1.4rem}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:.8rem}
.qtimer{flex:1;height:.6rem;background:var(--surface-2);border-radius:1rem;overflow:hidden;max-width:24rem}
.qtimer i{display:block;height:100%;background:var(--gold);width:100%;transition:width .25s linear}
.qtimer.low i{background:var(--down)}
.qsec{font-family:var(--mono);font-weight:700;font-size:1.3rem;min-width:3rem;text-align:right}
.qtext{font-family:var(--display);font-size:clamp(1.3rem,2.4vw,2rem);font-weight:700;margin:.3rem 0 1.1rem;line-height:1.25}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.opt{display:flex;align-items:center;gap:1rem;text-align:left;padding:1rem 1.2rem;border-radius:1rem;background:var(--surface-2);font-size:1.15rem;font-weight:600;min-height:4.6rem;border:3px solid transparent;transition:transform .12s,opacity .3s}
.opt:active{transform:scale(.98)}
.opt .L{width:2.4rem;height:2.4rem;border-radius:.7rem;display:grid;place-items:center;font-family:var(--display);font-weight:900;color:var(--bg);flex-shrink:0}
.opt:nth-child(1) .L{background:var(--sky)} .opt:nth-child(2) .L{background:var(--violet)} .opt:nth-child(3) .L{background:var(--gold)} .opt:nth-child(4) .L{background:var(--up)}
.opt.right{border-color:var(--up);background:var(--up-soft)}
.opt.wrong{border-color:var(--down);background:var(--down-soft)}
.opt.gone{opacity:.15;pointer-events:none}
.opt[disabled]{cursor:default}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:1rem;flex-wrap:wrap}
.qmsg{font-weight:700;font-size:1.1rem}
.qmsg.ok{color:var(--up)} .qmsg.no{color:var(--down)}
.setup{max-width:44rem;margin:1.5rem auto;background:var(--surface);border:1px solid var(--line);border-radius:1.4rem;padding:1.6rem;display:flex;flex-direction:column;gap:1rem}
.field{display:flex;flex-direction:column;gap:.35rem}
.field label{font-weight:700;font-size:.85rem;color:var(--muted)}
.field input,.field textarea,.field select{font:inherit;font-size:1.1rem;padding:.75rem 1rem;border-radius:.8rem;border:2px solid var(--line);background:var(--bg);color:var(--fg);min-height:3rem;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.winner{text-align:center;padding:2rem 1rem}
.winner .big-num{font-size:clamp(2rem,5vw,4rem)}

/* ---------- investor task ---------- */
.task{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:1.2rem;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:1.3rem;padding:1.2rem}
.panel h3{font-size:1.1rem;margin-bottom:.8rem}
.cond{font-size:1.05rem}
.cond b{color:var(--gold);font-family:var(--mono)}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1rem}
.inputs .field input{font-family:var(--mono);font-size:1rem;padding:.55rem .8rem;min-height:2.6rem}
.inputs .field label{font-size:.75rem}
.opts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
.ocard{border-radius:1.1rem;padding:1rem;background:var(--surface-2);border:3px solid transparent;text-align:left;display:flex;flex-direction:column;gap:.4rem;position:relative}
.ocard .t{font-family:var(--display);font-size:.95rem;font-weight:700}
.ocard .votes{display:flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:1.5rem;font-weight:700}
.ocard .votes small{font-family:var(--body);font-size:.75rem;color:var(--muted);font-weight:600}
.ocard.best{border-color:var(--up)}
.ocard .crown{position:absolute;top:-.8rem;right:.8rem;background:var(--up);color:var(--bg);font-weight:800;font-size:.75rem;padding:.2rem .6rem;border-radius:.5rem}
.steps{display:flex;flex-direction:column;gap:.6rem;margin-top:1rem}
.step{background:var(--surface-2);border-radius:1rem;padding:.8rem 1rem;display:flex;gap:.9rem;align-items:flex-start;animation:rise .45s both}
.step .k{width:2rem;height:2rem;border-radius:.6rem;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-family:var(--mono);font-weight:700;flex-shrink:0}
.step .m{font-family:var(--mono);font-size:1.02rem;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.step .m em{font-style:normal;color:var(--muted);font-family:var(--body);font-size:.9rem;display:block}
.step .m b{color:var(--gold)}
.bars{display:flex;flex-direction:column;gap:.6rem;margin-top:1rem}
.bar{display:grid;grid-template-columns:minmax(8.5rem,auto) 1fr 7.5rem;gap:.7rem;align-items:center}
.bar .bn{font-weight:700;font-size:.9rem;max-width:12rem;overflow-wrap:anywhere}
.bar .tr{height:2.2rem;background:var(--surface-2);border-radius:.6rem;overflow:hidden}
.bar .tr i{display:block;height:100%;width:0;border-radius:.6rem;transition:width 1.2s cubic-bezier(.3,1,.4,1)}
.bar .bv{font-family:var(--mono);font-weight:700;text-align:right;font-size:.95rem;font-variant-numeric:tabular-nums}
.answer{margin-top:1rem;padding:1rem 1.2rem;border-radius:1rem;background:var(--up-soft);border:2px solid var(--up);font-size:1.1rem;animation:pop .5s both}
.answer b{color:var(--up)}
.note{font-size:.9rem;color:var(--muted);margin-top:.6rem}

/* ---------- Q&A cards ---------- */
.kstats{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.kstats .chip{font-size:.95rem;padding:.5rem .9rem}
.chip.ok b{color:var(--up)} .chip.no b{color:var(--down)}
.qgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.8rem}
.qn{position:relative;aspect-ratio:2.3/1;border-radius:1rem;background:var(--surface);border:2px solid var(--line);font-family:var(--display);font-weight:900;font-size:clamp(1.4rem,2.6vw,2.6rem);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;transition:transform .15s,border-color .15s,background .2s;line-height:1}
.qn small{font-family:var(--body);font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.qn:hover{transform:translateY(-3px);border-color:var(--gold)}
.qn.ok{background:var(--up-soft);border-color:var(--up);color:var(--up)}
.qn.no{background:var(--down-soft);border-color:var(--down);color:var(--down)}
.qn.ok small,.qn.no small{color:inherit}
.qn.hl{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);transform:scale(1.06)}
.qn.hl small{color:var(--gold-ink)}
.qn.just{animation:pop .5s cubic-bezier(.2,1.5,.45,1)}
.kwrap{width:min(66rem,100%);display:flex;flex-direction:column;gap:1rem;position:relative}
.khead{display:flex;align-items:center;gap:.8rem;padding-right:3.6rem;min-height:2.8rem;flex-wrap:wrap}
.khead .xbtn{top:0;right:0}
.khead .chip{font-size:1rem}
.ktopic{color:#fff;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem;opacity:.85}
.kstate{color:#fff;opacity:.8;font-size:.85rem;margin-left:auto}
.kflip{perspective:1600px;height:min(56vh,27rem);width:100%;padding:0;text-align:center}
.kflip .inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.2,.4,1);transform-style:preserve-3d}
.kflip.on .inner{transform:rotateY(180deg)}
.kflip .f,.kflip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.6rem;padding:2rem 2.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;box-shadow:var(--shadow);overflow:auto}
.kflip .f{background:var(--surface);border:3px solid var(--line)}
.kq{font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,3vw,2.6rem);line-height:1.25;text-wrap:balance;color:var(--fg)}
.kflip .f small{color:var(--muted);font-weight:600;font-size:.95rem}
.kflip .b{background:var(--gold);color:var(--gold-ink);transform:rotateY(180deg)}
.kl{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;opacity:.7}
.ka{font-size:clamp(1.3rem,2.6vw,2.3rem);font-weight:700;line-height:1.3;text-wrap:balance}
.kctrl{display:grid;grid-template-columns:1fr 1.3fr 1.3fr 1fr;gap:.6rem}
.kctrl .btn{min-height:3.6rem;font-size:1.05rem}
.btn.kok{background:var(--up);color:#fff} .btn.kno{background:var(--down);color:#fff}
@media (max-width:1100px){.qgrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:760px){.qgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.kctrl{grid-template-columns:1fr 1fr}.kflip .f,.kflip .b{padding:1.2rem}}

/* ---------- bottom dock ---------- */
.dock{position:fixed;left:50%;bottom:calc(.8rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:35;display:flex;align-items:center;gap:.3rem;padding:.35rem;border-radius:2.2rem;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:opacity .4s,transform .3s;max-width:calc(100% - 2rem)}
.dock.idle{opacity:.5}
.dock:hover,.dock:focus-within{opacity:1}
.dock.away{transform:translate(-50%,160%);opacity:0;pointer-events:none}
.dk-menu{width:3rem;height:3rem;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;flex-shrink:0}
.burger{width:1.2rem;height:.9rem;position:relative;display:block}
.burger i{position:absolute;left:0;right:0;height:2.5px;border-radius:2px;background:currentColor;transition:transform .3s,opacity .2s,top .3s}
.burger i:nth-child(1){top:0}.burger i:nth-child(2){top:calc(50% - 1.25px)}.burger i:nth-child(3){top:calc(100% - 2.5px)}
.sheet-open .burger i:nth-child(1){top:calc(50% - 1.25px);transform:rotate(45deg)}
.sheet-open .burger i:nth-child(2){opacity:0}
.sheet-open .burger i:nth-child(3){top:calc(50% - 1.25px);transform:rotate(-45deg)}
.dk-arrow{width:2.7rem;height:2.7rem;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex-shrink:0}
.dk-arrow svg{width:1.2rem;height:1.2rem}
.dk-arrow[disabled]{opacity:.3;cursor:default}
.dk-cur{display:flex;align-items:center;gap:.6rem;padding:.25rem .9rem .25rem .3rem;border-radius:2rem;min-width:0;text-align:left}
.dk-cur:hover{background:var(--surface-2)}
.dk-ic{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;color:var(--bg);flex-shrink:0}
.dk-ic svg{width:1.2rem;height:1.2rem}
.dk-tx{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.dk-tx small{font-size:.66rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.dk-tx b{font-family:var(--display);font-size:.88rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:14rem}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(5,9,18,.55);backdrop-filter:blur(3px);animation:fin2 .25s both}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(68rem,100%);max-height:88%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:1.8rem 1.8rem 0 0;padding:1rem max(1.4rem,env(safe-area-inset-left,0px)) calc(1.4rem + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:sheetUp .45s cubic-bezier(.2,1.2,.4,1) both}
.sheet:before{content:"";display:block;width:3.2rem;height:.35rem;border-radius:1rem;background:var(--line);margin:0 auto .8rem}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}
.sheet-h small{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.sheet-h b{font-family:var(--display);font-size:1.4rem}
.sheet-h .xbtn{position:static}
.sheet-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem}
.sg{display:flex;align-items:center;gap:.8rem;text-align:left;padding:.8rem;border-radius:1.1rem;background:var(--surface-2);border:2px solid transparent;animation:rise .4s both;min-height:4.4rem}
.sg:hover{border-color:var(--gold)}
.sg.on{border-color:var(--gold);background:var(--gold-soft)}
.sg .ic{width:2.6rem;height:2.6rem;border-radius:.8rem;display:grid;place-items:center;color:var(--bg);flex-shrink:0}
.sg .ic svg{width:1.4rem;height:1.4rem}
.sg span.t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.sg small{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.sg b{font-weight:700;font-size:.95rem}
@keyframes sheetUp{from{transform:translate(-50%,100%)}}
@keyframes fin2{from{opacity:0}}
/* ---------- tool ball (radial menu) ---------- */
.fab{position:fixed;left:0;top:0;width:0;height:0;z-index:45}
.fab-ball{position:absolute;left:-2.2rem;top:-2.2rem;width:4.4rem;height:4.4rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe6a3,var(--gold) 55%,#d68d10);color:var(--gold-ink);display:grid;place-items:center;box-shadow:0 .4rem 1.4rem rgba(0,0,0,.35),0 0 0 .35rem var(--gold-soft);touch-action:none;cursor:grab;z-index:3;transition:transform .25s}
.fab-ball:active{cursor:grabbing}
.fab-ball svg{width:1.9rem;height:1.9rem;transition:transform .35s cubic-bezier(.3,1.5,.4,1)}
.fab.open .fab-ball svg{transform:rotate(135deg)}
.fab:not(.open) .fab-ball{animation:ballGlow 3s ease-in-out infinite}
@keyframes ballGlow{50%{box-shadow:0 .4rem 1.4rem rgba(0,0,0,.35),0 0 0 .8rem var(--gold-soft)}}
.fab-ball .mini{position:absolute;bottom:-.7rem;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:.68rem;font-weight:700;background:var(--down);color:#fff;padding:.05rem .4rem;border-radius:.5rem;white-space:nowrap}
.fab-ring{position:absolute;left:0;top:0;width:var(--rd,16rem);height:var(--rd,16rem);margin-left:calc(var(--rd,16rem) / -2);margin-top:calc(var(--rd,16rem) / -2);border-radius:50%;background:radial-gradient(circle,var(--gold-soft) 0 22%,var(--surface) 23% 100%);border:2px solid var(--line);box-shadow:var(--shadow);transform:scale(0);opacity:0;transition:transform .45s cubic-bezier(.2,1.3,.4,1),opacity .3s;pointer-events:none;z-index:1}
.fab-ring:after{content:"";position:absolute;inset:18%;border-radius:50%;border:2px dashed var(--line);animation:spinR 22s linear infinite}
@keyframes spinR{to{transform:rotate(360deg)}}
.fab.open .fab-ring{transform:scale(1);opacity:.97}
.fab-it{position:absolute;left:-1.75rem;top:-1.75rem;width:3.5rem;height:3.5rem;border-radius:50%;background:var(--surface-2);color:var(--fg);display:grid;place-items:center;z-index:2;opacity:0;pointer-events:none;transform:translate(0,0) scale(.2);transition:transform .45s cubic-bezier(.2,1.4,.4,1),opacity .25s,background .2s;transition-delay:calc(var(--i) * 35ms);border:2px solid var(--line)}
.fab-it svg{width:1.45rem;height:1.45rem}
.lang-g{font-family:var(--display);font-weight:900;font-size:.95rem;letter-spacing:.02em}
#tLang{background:var(--gold-soft);border-color:var(--gold)}
.fab-it:hover{background:var(--line)}
.fab-it.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}

hujjatlar\",\"Nizom\",2)+card5(\"up\",\"var(--up)\",\"Mablag‘larni jalb etish\",\"Qo‘shimcha aksiyalar chiqarish\",3)+card5(\"percent\",\"var(--down)\",\"Soliqqa tortish\",\"Dividend va foizlar ko‘rinishida aksiyadorlarga to‘lanadigan daromadlarga soliq solish\",4)+'<\/div><div class=\"reveal-q\" style=\"margin-top:1.2rem\"><button class=\"rq\">Savol: bu jihatlarning qaysilari boshqa biznes shakllari uchun ham tegishli? <span class=\"hint\">bosing<\/span><span class=\"a\" hidden>Masalan, tashkiliy hujjat (nizom) va daromadlarga soliq solish mas’uliyati cheklangan jamiyat (MChJ) kabi boshqa shakllarga ham xos. Aksiya chiqarib mablag‘ jalb etish esa aynan AJ ning xususiyati.<\/span><\/button><\/div>',\n '<div class=\"tag\">TUSHUNCHA<\/div><h3>Aksiyadorlik jamiyati nima?<\/h3><div class=\"def\"><b>Aksiyadorlik jamiyati (AJ)<\/b> — muassislar (aksiyadorlar)ning ixtiyoriy hissalari asosida tashkil etilgan biznes yuritish shakli.<\/div><p>Eng yirik tadbirkorlik shakllaridan biri. Ayrim hollarda <b>korporatsiya<\/b> deb ham yuritiladi.<\/p><p style=\"margin-top:1rem;font-weight:700\">Misollar:<\/p><div class=\"chips\"><span class=\"chip\">Apple Inc.<\/span><span class=\"chip\">Microsoft<\/span><span class=\"chip\">O‘zbekiston havo yo‘llari<\/span><span class=\"chip\">O‘zbekiston temir yo‘llari<\/span><\/div>',\n '<div class=\"tag\">QONUN<\/div><h3>Qonundagi ta’rif<\/h3><div class=\"def\" style=\"font-size:1.35rem\">Ustav fondi (ustav kapitali) aksiyadorlarning aksiyadorlik jamiyatiga nisbatan huquqlarini tasdiqlovchi muayyan miqdordagi <b>aksiyalarga taqsimlangan<\/b> tijorat tashkiloti aksiyadorlik jamiyati deb e’tirof etiladi.<\/div><p class=\"law\">O‘zbekiston Respublikasining 2014-yil 6-maydagi O‘RQ-370-sonli yangi tahrirdagi «Aksiyadorlik jamiyatlari va aksiyadorlarning huquqlarini himoya qilish to‘g‘risida»gi qonuni, 3-modda<\/p><p style=\"margin-top:1rem\">Oddiy qilib aytganda: <b>kompaniya kapitali teng bo‘laklarga bo‘linadi<\/b>, har bir bo‘lak bitta aksiya.<\/p>',\n '<div class=\"tag\">TURLARI<\/div><h3>Ochiq va yopiq aksiyadorlik jamiyati<\/h3><div class=\"rows\"><div class=\"cmp\"><div class=\"h\"><\/div><div class=\"h\" style=\"color:var(--sky)\">Ochiq AJ<\/div><div class=\"h\" style=\"color:var(--violet)\">Yopiq AJ<\/div><\/div><div class=\"cmp\"><div class=\"k\">Muassislar soni<\/div><div>Eng kam soni cheklanmaydi<\/div><div>Kamida 3 ta shaxs<\/div><\/div><div class=\"cmp\"><div class=\"k\">Aksiyadorlar soni<\/div><div>Cheklanmagan<\/div><div>50 nafardan oshmaydi<\/div><\/div><div class=\"cmp\"><div class=\"k\">Aksiyalarni sotish<\/div><div>Ochiq obuna, erkin sotish mumkin<\/div><div>Faqat muassislar yoki belgilangan doira orasida<\/div><\/div><div class=\"cmp\"><div class=\"k\">Boshqa aksiyadorlar roziligi<\/div><div>Kerak emas<\/div><div>Cheklangan doiradan tashqariga sotib bo‘lmaydi<\/div><\/div><\/div><p style=\"margin-top:.8rem\">Jamiyatning har bir muassisi uning aksiyadori bo‘lishi lozim.<\/p>',\n '<div class=\"tag\">2014-YILDAN BUYON<\/div><h3>Nega endi «yopiq AJ» yo‘q?<\/h3><div class=\"vs\"><div class=\"vs-col gold\"><h4>Qonun nima dedi?<\/h4><ul><li>Aksiyalarni ochiq va yopiq obuna yo‘li bilan joylashtirish mumkin.<\/li><li>AJ lar ochiq va yopiq turlarga ajratilmaydi.<\/li><li>Ular umumiy holda <b>aksiyadorlik jamiyati<\/b> deb yuritiladi.<\/li><\/ul><\/div><div class=\"vs-col sky\"><h4>Sababi<\/h4><ul><li>Yopiq AJ mazmunan <b>mas’uliyati cheklangan jamiyatlarga<\/b> (MChJ) o‘xshash edi.<\/li><li>Ikki o‘xshash shakl ortiqcha chalkashlik tug‘dirardi.<\/li><\/ul><\/div><\/div>',\n '<div class=\"tag\">TASHKIL ETISH<\/div><h3>AJ qanday tuziladi?<\/h3><div class=\"vs\"><div class=\"vs-col up\"><h4>1-yo‘l: yangidan ta’sis etish<\/h4><ul><li>Muassislar yig‘ilib, yangi jamiyat tuzadi.<\/li><\/ul><h4 style=\"margin-top:1rem\">2-yo‘l: qayta tashkil etish<\/h4><div class=\"chips\"><span class=\"chip\">qo‘shib yuborish<\/span><span class=\"chip\">birlashtirish<\/span><span class=\"chip\">bo‘lish<\/span><span class=\"chip\">ajratib chiqarish<\/span><span class=\"chip\">qayta tuzish<\/span><\/div><\/div><div class=\"vs-col gold\"><h4>Ustav kapitalining minimal miqdori<\/h4><div class=\"big-num\">1 600 mln<\/div><p style=\"font-size:1.3rem;font-weight:700\">so‘m<\/p><p style=\"color:var(--muted);font-size:.95rem\">Ustav fondi aksiyadorlar sotib olgan aksiyalarning <b>nominal qiymatidan<\/b> tashkil topadi.<\/p><\/div><\/div>',\n '<div class=\"tag\">AKSIYA<\/div><h3>Aksiya, nominal qiymat, aksiyador<\/h3><div style=\"display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:1.5rem;align-items:center\" class=\"sl-cover\"><div><div class=\"def\"><b>Aksiya<\/b> — egasi AJ kapitaliga hissa qo‘shganligi va foydadan <b>dividend<\/b> olish huquqi borligiga guvohlik beruvchi qimmatli qog‘oz.<\/div><div class=\"def\"><b>Nominal qiymat<\/b> — aksiyaning o‘zida belgilab qo‘yilgan qiymat. Barcha aksiyalarniki bir xil bo‘ladi.<\/div><div class=\"def\"><b>Aksiyador<\/b> — aksiyaning egasi bo‘lgan yuridik yoki jismoniy shaxs.<\/div><\/div><div class=\"cert mini-cert\"><div class=\"c-top\"><span>Nomi yozilgan<\/span><span>Emissiyaviy<\/span><\/div><div class=\"c-title\">AKSIYA<\/div><div class=\"c-sub\">Egasi: aksiyador<\/div><div class=\"c-val\"><small>Nominal qiymati<\/small>25 000 so‘m<\/div><div class=\"seal\">QIMMATLI<br>QOG‘OZ<\/div><\/div><\/div>',\n '<div class=\"tag\">AKSIYA TURLARI<\/div><h3>Oddiy va imtiyozli aksiya<\/h3><div class=\"vs\"><div class=\"vs-col sky\"><h4>Oddiy aksiya<\/h4><ul><li>Ovoz beruvchi aksiya<\/li><li>Umumiy yig‘ilishda va jamiyatni boshqarishda ishtirok etish huquqi<\/li><li>Dividend qo‘yilgan mablag‘ga mutanosib taqsimlanadi<\/li><li>Foyda ko‘p bo‘lsa, dividend ham ko‘p<\/li><\/ul><\/div><div class=\"vs-col gold\"><h4>Imtiyozli aksiya<\/h4><ul><li>Dividendni birinchi navbatda oladi<\/li><li>Jamiyat foyda ko‘rish-ko‘rmasligidan qat’i nazar, muayyan dividend kafolatlanadi<\/li><li>Jamiyat tugatilsa, mablag‘ni birinchi oladi<\/li><li>Dividend va mol-mulkni taqsimlashda ustunlik<\/li><\/ul><\/div><\/div>',\n '<div class=\"tag\">BAHOLAYMIZ<\/div><h3>Afzalliklari va kamchiliklari<\/h3><div class=\"vs\"><div class=\"vs-col up\"><h4>'+ic(\"up\")+' Afzalliklari<\/h4><ul><li>Katta mablag‘ni oson jamlaydi: yetarli aksiya chiqarish kifoya<\/li><li>Boshqaruvni shartnoma asosida ishonchli boshqaruvchiga topshirish mumkin<\/li><li>Boshqaruvda ishtirok aksiya turiga bog‘liq<\/li><li>Oddiy aksiya: ovoz, dividend, boshqaruvda ishtirok<\/li><li>Imtiyozli aksiya: dividend va mablag‘ni birinchi olish<\/li><\/ul><\/div><div class=\"vs-col down\"><h4>'+ic(\"down\")+' Kamchiliklari<\/h4><ul><li>Aksiyadorlar ko‘pligi boshqaruvni qiyinlashtiradi, shuning uchun boshqaruv kengashi tuziladi va direktor tayinlanadi<\/li><li>Har bir muhim qaror aksiyadorlar yig‘ilishida muhokama qilinadi, bu jarayonni cho‘zadi<\/li><\/ul><\/div><\/div>',\n '<div class=\"tag\">DIVIDEND VA SOLIQ<\/div><h3>Dividend nima?<\/h3><div class=\"def\"><b>Dividend<\/b> (lotincha <i>dividendus<\/i> — «bo‘lishga tegishli») — aksiya egasiga to‘lanadigan daromad.<\/div><p>E’lon qilingan dividendlar qonunga muvofiq <b>soliqqa tortiladi<\/b>.<\/p><p>Aksiyani sotganda daromad solig‘i to‘lanadi. U xarid va sotish orasidagi farqdan hisoblanadi:<\/p><div class=\"formula\" style=\"margin:.6rem 0\">Daromad = <span class=\"u\">Sotish narxi<\/span> − <span class=\"d\">Xarid narxi<\/span><\/div><p>Misol: aksiyani <b>20 000<\/b> so‘mga olib, <b>26 000<\/b> so‘mga sotdingiz. Soliq <b>6 000<\/b> so‘mlik daromaddan hisoblanadi.<\/p><p style=\"color:var(--muted)\">Aksiyador jamiyatdan aksiyalarini sotib olishni so‘rab, biznesni tark etishi ham mumkin.<\/p>',\n '<div class=\"tag\">BILIMINGIZNI SINAB KO‘RING · 42-bet<\/div><h3>Takrorlash savollari<\/h3><div class=\"reveal-q\">'+[\n   [\"Aksiyadorlik jamiyatining qanday turlari mavjud?\",\"Ochiq va yopiq. 2014-yildan buyon esa umumiy holda «aksiyadorlik jamiyati» deb yuritiladi.\"],\n   [\"Aksiyadorlar soni jihatidan ochiq va yopiq AJ qanday farq ельных акций\",3)+card5(\"percent\",\"var(--down)\",\"Налогообложение\",\"Налог на доходы акционеров в виде дивидендов и процентов\",4)+'<\/div><div class=\"reveal-q\" style=\"margin-top:1.2rem\"><button class=\"rq\">Вопрос: какие из этих черт относятся и к другим формам бизнеса? <span class=\"hint\">нажмите<\/span><span class=\"a\" hidden>Например, учредительный документ (устав) и налогообложение доходов есть и у других форм, например у общества с ограниченной ответственностью (ООО). А привлечение средств через выпуск акций — особенность именно АО.<\/span><\/button><\/div>',\n '<div class=\"tag\">ПОНЯТИЕ<\/div><h3>Что такое акционерное общество?<\/h3><div class=\"def\"><b>Акционерное общество (АО)<\/b> — форма ведения бизнеса, созданная на основе добровольных взносов учредителей (акционеров).<\/div><p>Одна из крупнейших форм предпринимательства. Иногда его называют <b>корпорацией<\/b>.<\/p><p style=\"margin-top:1rem;font-weight:700\">Примеры:<\/p><div class=\"chips\"><span class=\"chip\">Apple Inc.<\/span><span class=\"chip\">Microsoft<\/span><span class=\"chip\">«Узбекистон хаво йуллари»<\/span><span class=\"chip\">«Узбекистон темир йуллари»<\/span><\/div>',\n '<div class=\"tag\">ЗАКОН<\/div><h3>Определение в законе<\/h3><div class=\"def\" style=\"font-size:1.35rem\">Акционерным обществом признаётся коммерческая организация, уставный фонд (уставный капитал) которой <b>разделён на определённое число акций<\/b>, удостоверяющих права акционеров по отношению к обществу.<\/div><p class=\"law\">Закон Республики Узбекистан «Об акционерных обществах и защите прав акционеров» в новой редакции № ЗРУ-370 от 6 мая 2014 года, статья 3<\/p><p style=\"margin-top:1rem\">Проще говоря: <b>капитал компании делится на равные части<\/b>, каждая часть — одна акция.<\/p>',\n '<div class=\"tag\">ВИДЫ<\/div><h3>Открытое и закрытое акционерное общество<\/h3><div class=\"rows\"><div class=\"cmp\"><div class=\"h\"><\/div><div class=\"h\" style=\"color:var(--sky)\">Открытое АО<\/div><div class=\"h\" style=\"color:var(--violet)\">Закрытое АО<\/div><\/div><div class=\"cmp\"><div class=\"k\">Число учредителей<\/div><div>Минимум не ограничен<\/div><div>Не менее 3 лиц<\/div><\/div><div class=\"cmp\"><div class=\"k\">Число акционеров<\/div><div>Не ограничено<\/div><div>Не более 50<\/div><\/div><div class=\"cmp\"><div class=\"k\">Продажа акций<\/div><div>Открытая подписка, свободная продажа<\/div><div>Только среди учредителей или определённого круга лиц<\/div><\/div><div class=\"cmp\"><div class=\"k\">Согласие других акционеров<\/div><div>Не требуется<\/div><div>Нельзя продать за пределы ограниченного круга<\/div><\/div><\/div><p style=\"margin-top:.8rem\">Каждый учредитель общества должен быть его акционером.<\/p>',\n '<div class=\"tag\">С 2014 ГОДА<\/div><h3>Почему больше нет «закрытого АО»?<\/h3><div class=\"vs\"><div class=\"vs-col gold\"><h4>Что сказал закон?<\/h4><ul><li>Акции можно размещать путём открытой и закрытой подписки.<\/li><li>АО не делятся на открытые и закрытые.<\/li><li>Все они называются просто <b>акционерными обществами<\/b>.<\/li><\/ul><\/div><div class=\"vs-col sky\"><h4>Причина<\/h4><ul><li>Закрытое АО по сути было похоже на <b>общество с ограниченной ответственностью<\/b> (ООО).<\/li><li>Две похожие формы создавали лишнюю путаницу.<\/li><\/ul><\/div><\/div>',\n '<div class=\"tag\">СОЗДАНИЕ<\/div><h3>Как создаётся АО?<\/h3><div class=\"vs\"><div class=\"vs-col up\"><h4>Путь 1: учреждение с нуля<\/h4><ul><li>Учредители собираются и создают новое общество.<\/li><\/ul><h4 style=\"margin-top:1rem\">Путь 2: реорганизация<\/h4><div class=\"chips\"><span class=\"chip\">присоединение<\/span><span class=\"chip\">слияние<\/span><span class=\"chip\">разделение<\/span><span class=\"chip\">выделение<\/span><span class=\"chip\">преобразование<\/span><\/div><\/div><div class=\"vs-col gold\"><h4>Минимальный размер уставного капитала<\/h4><div class=\"big-num\">1 600 млн<\/div><p style=\"font-size:1.3rem;font-weight:700\">сумов<\/p><p style=\"color:var(--muted);font-size:.95rem\">Уставный фонд складывается из <b>номинальной стоимости<\/b> акций, купленных акционерами.<\/p><\/div><\/div>',\n '<div class=\"tag\">АКЦИЯ<\/div><h3>Акция, номинальная стоимость, акционер<\/h3><div style=\"display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:1.5rem;align-items:center\" class=\"sl-cover\"><div><div class=\"def\"><b>Акция<\/b> — ценная бумага, удостоверяющая, что её владелец внёс долю в капитал АО и имеет право получать из прибыли <b>дивиденды<\/b>.<\/div><div class=\"def\"><b>Номинальная стоимость<\/b> — стоимость, указанная на самой акции. У всех акций она одинакова.<\/div><div class=\"def\"><b>Акционер<\/b> — юридическое или физическое лицо, владеющее акцией.<\/div><\/div><div class=\"cert mini-cert\"><div class=\"c-top\"><span>Именная<\/span><span>Эмиссионная<\/span><\/div><div class=\"c-title\">АКЦИЯ<\/div><div class=\"c-sub\">Владелец: акционер<\/div><div class=\"c-val\"><small>Номинальная стоимость<\/small>25 000 сум<\/div><div class=\"seal\">ЦЕННАЯ<br>БУМАГА<\/div><\/div><\/div>',\n '<div class=\"tag\">ВИДЫ АКЦИЙ<\/div><h3>Обыкновенная и привилегированная акция<\/h3><div class=\"vs\"><div class=\"vs-col sky\"><h4>Обыкновенная акция<\/h4><ul><li>Голосующая акция<\/li><li>Право участвовать в общем собрании и в управлении обществом<\/li><li>Дивиденд распределяется пропорционально вложенным средствам<\/li><li>Больше прибыль — больше дивиденд<\/li><\/ul><\/div><div class=\"vs-col gold\"><h4>Привилегированная акция<\/h4><ul><li>Получает дивиденд в первую очередь<\/li><li>Определённый дивиденд гарантирован независимо от прибыли общества<\/li><li>При ликвидации общества получает средства первой<\/li><li>Преимущество при распределении дивидендов и имущества<\/li><\/ul><\/div><\/div>',\n '<div class=\"tag\">ОЦЕНИВАЕМ<\/div><h3>Преимущества и недостатки<\/h3><div class=\"vs\"><div class=\"vs-col up\"><h4>'+ic(\"up\")+' Преимущества<\/h4><ul><li>Легко собрать крупные средства: достаточно выпустить нужное число акций<\/li><li>Управление можно по договору передать доверенному управляющему<\/li><li>Участие в управлении зависит от вида акций<\/li><li>Обыкновенная акция: голос, дивиденд, участие в управлении<\/li><li>Привилегированная акция: первоочередное получение дивидендов и средств<\/li><\/ul><\/div><div class=\"vs-col down\"><h4>'+ic(\"down\")+' Недостатки<\/h4><ul><li>Из-за большого числа акционеров управлять сложнее, поэтому создаётся совет директоров и назначается директор<\/li><li>Каждое важное решение обсуждается на собрании акционеров, это затягивает процесс<\/li><\/ul><\/div><\/div>',\n '<div class=\"tag\">ДИВИДЕНДЫ И НАЛОГИ<\/div><h3>Что такое дивиденд?<\/h3><div class=\"def\"><b>Дивиденд<\/b> (лат. <i>dividendus<\/i> — «подлежащий разделу») — доход, выплачиваемый владельцу акции.<\/div><p>Объявленные дивиденды <b>облагаются налогом<\/b> согласно закону.<\/p><p>При продаже акций уплачивается налог на доход. Он считается с разницы между ценой покупки и ценой продажи:<\/p><div class=\"formula\" style=\"margin:.6rem 0\">Доход = <span class=\"u\">Цена продажи<\/span> − <span class=\"d\">Цена покупки<\/span><\/div><p>Пример: вы купили акцию за <b>20 000<\/b> сумов и продали за <b>26 000<\/b>. Налог считается с дохода <b>6 000<\/b> сумов.<\/p><p style=\"color:var(--muted)\">Акционер может также выйти из бизнеса, попросив общество выкупить его акции.<\/p>',\n '<div class=\"tag\">ПРОВЕРЬТЕ СЕБЯ · с. 42<\/div><h3>Вопросы для повторения<\/h3><div class=\"reveal-q\">'+[\n   [\"Какие виды акционерных обществ существуют?\",\"Открытые и закрытые. А с 2014 года все они называются просто «акционерное общество».\"],\n   [\"Чем отличаются открытое и закрытое АО по числу акционеров?\",\"В открытом АО число акционеров не ограничено. В закрытом АО их должно было быть не более 50.\"],\n   [\"Почему в законодательстве нет формы закрытого АО?\",\"Потому что закрытое АО по сути похоже на общество с ограниченной ответственностью.\"],\n   [\"Каков минимальный размер уставного капитала АО в
